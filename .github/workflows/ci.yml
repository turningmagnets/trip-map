name: product ci

on:
  pull_request:
  push:
    branches: ["mergify/merge-queue/**", "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tier:
    runs-on: [self-hosted, aios-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node --test tests/*.test.mjs
